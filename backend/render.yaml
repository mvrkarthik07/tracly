services:
  - type: web
    name: finance-tracker-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_HASH
        sync: false
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: finance-tracker-db
    plan: starter
