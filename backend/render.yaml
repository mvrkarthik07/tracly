services:
  - type: web
    name: finance-tracker-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_HASH
        sync: false
      - key: CRON_SECRET
        generateValue: true

  - type: cron
    name: finance-tracker-weekly-report
    runtime: node
    rootDir: backend
    schedule: "1 16 * * 0"
    buildCommand: npm ci
    startCommand: >-
      curl --fail --silent --show-error -X POST
      "${BACKEND_URL}/api/reports/generate"
      -H "X-Cron-Secret: ${CRON_SECRET}"
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: finance-tracker-api
          property: host
      - key: CRON_SECRET
        fromService:
          type: web
          name: finance-tracker-api
          envVarKey: CRON_SECRET

  - type: cron
    name: finance-tracker-recurring-transactions
    runtime: node
    rootDir: backend
    schedule: "5 16 * * *"
    buildCommand: npm ci
    startCommand: >-
      curl --fail --silent --show-error -X POST
      "${BACKEND_URL}/api/recurring/generate"
      -H "X-Cron-Secret: ${CRON_SECRET}"
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: finance-tracker-api
          property: host
      - key: CRON_SECRET
        fromService:
          type: web
          name: finance-tracker-api
          envVarKey: CRON_SECRET

databases:
  - name: finance-tracker-db
    plan: starter
